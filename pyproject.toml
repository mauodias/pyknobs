[project]
name = "pyknobs"
version = "0.1.0"
description = "Virtual MIDI knob controller simulator for macOS IAC Driver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    "textual>=8.2.8",
]

[project.scripts]
pyknobs = "pyknobs.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
